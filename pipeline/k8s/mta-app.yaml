# Placeholder Streamlit app (streamlit hello) to test the Cloudflare Tunnel + Access route.
# Later, swap image/command for the real app; keep the Service name so the tunnel route stays the same.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mta-app
  namespace: mta-pipeline
  labels: { app: mta-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: mta-app } }
  template:
    metadata: { labels: { app: mta-app } }
    spec:
      containers:
      - name: streamlit
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --no-cache-dir streamlit && streamlit hello --server.port=8501 --server.address=0.0.0.0 --server.headless=true"]
        ports: [{ containerPort: 8501, name: http }]
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
        readinessProbe:
          httpGet: { path: /_stcore/health, port: 8501 }
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mta-app
  namespace: mta-pipeline
  labels: { app: mta-app }
spec:
  selector: { app: mta-app }
  ports: [{ name: http, port: 8501, targetPort: 8501 }]
