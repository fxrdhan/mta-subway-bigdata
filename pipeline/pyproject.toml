[project]
name = "mta-pipeline"
version = "0.1.0"
description = "Batch ELT for MTA Subway Hourly Ridership: SODA API -> MinIO (Parquet) -> PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.5.6",
    "psycopg[binary]>=3.2",
    "pyarrow==25.0.1",
    "pytz>=2025.2",  # DuckDB needs it to return TIMESTAMPTZ values to Python
    "requests>=2.34.2",
]

[project.scripts]
mta-pipeline = "mta_pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mta_pipeline"]
