# Streaming ETL for GTFS-RT: Kafka (one KRaft broker), MongoDB, the Python producer, and Spark Structured Streaming.
# Code comes from the ConfigMap streaming-code (producer.py, spark_etl.py); MongoDB credentials from the Secret mta-mongo.
apiVersion: v1
kind: Service
metadata: { name: mta-kafka, namespace: mta-pipeline, labels: { app: mta-kafka } }
spec:
  selector: { app: mta-kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mta-kafka, namespace: mta-pipeline, labels: { app: mta-kafka } }
spec:
  serviceName: mta-kafka
  replicas: 1
  selector: { matchLabels: { app: mta-kafka } }
  template:
    metadata: { labels: { app: mta-kafka } }
    spec:
      nodeSelector: { workload: jupyter }
      tolerations: [{ key: workload, operator: Equal, value: jupyter, effect: NoSchedule }]
      containers:
      - name: kafka
        image: apache/kafka:4.3.1
        ports: [{ containerPort: 9092 }]
        env:
        - { name: CLUSTER_ID, value: "79UztKfqSD-S7ZQGs_V06g" }
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://mta-kafka.mta-pipeline.svc.cluster.local:9092" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_LOG_RETENTION_HOURS, value: "24" }
        - { name: KAFKA_MESSAGE_MAX_BYTES, value: "4000000" }
        - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
        - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx768m" }
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: "1", memory: 1536Mi }
        volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
      volumes:
      - name: data
        emptyDir: { sizeLimit: 3Gi }   # temporary buffer only; a lost buffer is refilled from the archive
---
apiVersion: v1
kind: Service
metadata: { name: mta-mongo, namespace: mta-pipeline, labels: { app: mta-mongo } }
spec:
  selector: { app: mta-mongo }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mta-mongo, namespace: mta-pipeline, labels: { app: mta-mongo } }
spec:
  serviceName: mta-mongo
  replicas: 1
  selector: { matchLabels: { app: mta-mongo } }
  template:
    metadata: { labels: { app: mta-mongo } }
    spec:
      nodeSelector: { workload: jupyter }
      tolerations: [{ key: workload, operator: Equal, value: jupyter, effect: NoSchedule }]
      containers:
      - name: mongo
        image: mongo:8.0.38
        args: ["--wiredTigerCacheSizeGB", "0.25"]
        ports: [{ containerPort: 27017 }]
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: { secretKeyRef: { name: mta-mongo, key: username } }
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: mta-mongo, key: password } }
        resources:
          requests: { cpu: 250m, memory: 768Mi }
          limits: { cpu: "1", memory: 1Gi }
        volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: nfs-prod
      resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mta-gtfs-producer, namespace: mta-pipeline, labels: { app: mta-gtfs-producer } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mta-gtfs-producer } }
  template:
    metadata: { labels: { app: mta-gtfs-producer } }
    spec:
      containers:
      - name: producer
        image: python:3.13-slim
        command: ["sh", "-c"]
        args:
        - >-
          pip install --no-cache-dir --quiet --disable-pip-version-check --root-user-action=ignore
          confluent-kafka==2.16.1 "requests>=2.34.2" && exec python /app/producer.py
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: KAFKA_BOOTSTRAP, value: "mta-kafka.mta-pipeline.svc.cluster.local:9092" }
        - { name: KAFKA_TOPIC, value: mta-gtfs-stream }
        - { name: POLL_SECONDS, value: "30" }
        # pip install menulis ±30 MB ke disk node; request ephemeral-storage mencegah pod ini dipilih lebih dahulu
        # saat node kekurangan disk (pernah di-evict karena request-nya 0).
        resources:
          requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }
          limits: { cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi }
        volumeMounts: [{ name: code, mountPath: /app, readOnly: true }]
      volumes:
      - name: code
        configMap: { name: streaming-code }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: spark-checkpoint, namespace: mta-pipeline }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-prod
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mta-spark-streaming, namespace: mta-pipeline, labels: { app: mta-spark-streaming } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one streaming query per checkpoint
  selector: { matchLabels: { app: mta-spark-streaming } }
  template:
    metadata: { labels: { app: mta-spark-streaming } }
    spec:
      nodeSelector: { workload: jupyter }
      tolerations: [{ key: workload, operator: Equal, value: jupyter, effect: NoSchedule }]
      securityContext: { fsGroup: 185 }
      containers:
      - name: spark
        image: apache/spark:4.2.1-python3
        command: ["bash", "-c"]
        args:
        - >-
          python3 -m pip install --no-cache-dir --quiet --disable-pip-version-check --target /tmp/pylib
          "nyct-gtfs>=2.0" "psycopg[binary]>=3.2" "pymongo>=4.15,<5" "requests>=2.34.2"
          && export PYTHONPATH=/tmp/pylib:$PYTHONPATH
          && exec /opt/spark/bin/spark-submit --master "local[2]" --driver-memory 1200m
          --conf spark.jars.ivy=/tmp/ivy --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1
          /app/spark_etl.py
        env:
        - { name: PYTHONUNBUFFERED, value: "1" }
        - { name: HOME, value: /tmp }
        - { name: KAFKA_BOOTSTRAP, value: "mta-kafka.mta-pipeline.svc.cluster.local:9092" }
        - { name: KAFKA_TOPIC, value: mta-gtfs-stream }
        - { name: CHECKPOINT, value: /checkpoint/gtfs-etl }
        - { name: PGHOST, value: "postgres.db.svc.cluster.local" }
        - { name: PGPORT, value: "5432" }
        - { name: PGDATABASE, value: mta }
        - name: PGUSER
          valueFrom: { secretKeyRef: { name: mta-postgres, key: username } }
        - name: PGPASSWORD
          valueFrom: { secretKeyRef: { name: mta-postgres, key: password } }
        - name: MONGO_URI
          valueFrom: { secretKeyRef: { name: mta-mongo, key: uri } }
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "2", memory: 2560Mi }
        volumeMounts:
        - { name: code, mountPath: /app, readOnly: true }
        - { name: checkpoint, mountPath: /checkpoint }
      volumes:
      - name: code
        configMap: { name: streaming-code }
      - name: checkpoint
        persistentVolumeClaim: { claimName: spark-checkpoint }
