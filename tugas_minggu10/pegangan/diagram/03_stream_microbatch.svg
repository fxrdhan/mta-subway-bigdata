<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:612px;height:775px;background:#FFFFFF;" width="612px" height="775px" viewBox="0 0 612 775" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="129.799" y="30.01" fill="#000" font-size="13" textLength="351.108" font-weight="700" font-family="Helvetica">Jalur streaming: satu micro-batch Spark (setiap 30 detik)</text></g><ellipse cx="231.112" cy="59" rx="10" ry="10" fill="#1E1E1E" style="stroke:#222;stroke-width:1;"/><rect x="95.753" y="89" width="270.717" height="42" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="4" ry="4"/><text x="105.753" y="107.47" fill="#000" font-size="11" textLength="187.704" font-family="Helvetica">Spark membaca offset baru dari Kafka</text><text x="105.753" y="118.47" fill="#000" font-size="11" textLength="250.717" font-family="Helvetica">(paling banyak 400 pesan, melanjutkan checkpoint)</text><polygon points="193.026,151,269.198,151,281.198,163,269.198,175,193.026,175,181.026,163,193.026,151" fill="#F4F4F4" style="stroke:#1E1E1E;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.112" y="182.7" fill="#4A4A4A" font-size="10" textLength="10.562" font-family="Helvetica">ya</text><text x="193.026" y="165.7" fill="#000" font-size="10" textLength="76.172" font-family="Helvetica">Ada pesan baru?</text><text x="281.198" y="160.7" fill="#4A4A4A" font-size="10" textLength="21.123" font-family="Helvetica">tidak</text><ellipse cx="324.321" cy="163" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="324.321" cy="163" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="41.049" y="204.2" width="380.126" height="31" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="4" ry="4"/><text x="51.049" y="222.67" fill="#000" font-size="11" textLength="360.126" font-family="Helvetica">Unduh ulang jadwal statis GTFS bila hari (zona New York) sudah berganti</text><rect x="61.204" y="255.2" width="339.816" height="42" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="4" ry="4"/><text x="71.204" y="273.67" fill="#000" font-size="11" textLength="319.816" font-family="Helvetica">aggregate(): decode setiap pesan menjadi observasi, lalu agregat</text><text x="71.204" y="284.67" fill="#000" font-size="11" textLength="214.011" font-family="Helvetica">menit × rute × arah dan jam × stasiun × rute</text><path d="M413.391,317.7 L413.391,328.7 L393.391,332.7 L413.391,336.7 L413.391,347.7 A0,0 0 0 0 413.391,347.7 L591.705,347.7 A0,0 0 0 0 591.705,347.7 L591.705,327.7 L581.705,317.7 L413.391,317.7 A0,0 0 0 0 413.391,317.7" style="stroke:#8A8A8A;stroke-width:0.5;" fill="#FFFBEA"/><path d="M581.705,317.7 L581.705,327.7 L591.705,327.7 L581.705,317.7" style="stroke:#8A8A8A;stroke-width:0.5;" fill="#FFFBEA"/><text x="419.391" y="330.4" fill="#000" font-size="10" textLength="122.871" font-family="Helvetica">Idempoten: penulisan ulang</text><text x="419.391" y="340.4" fill="#000" font-size="10" textLength="157.314" font-family="Helvetica">menghasilkan dokumen yang sama</text><rect x="68.833" y="317.2" width="324.557" height="31" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="4" ry="4"/><text x="78.833" y="335.67" fill="#000" font-size="11" textLength="304.557" font-family="Helvetica">MongoDB: upsert dokumen kedatangan dan gangguan per _id</text><rect x="88.169" y="368.2" width="285.885" height="42" fill="#FFF" style="stroke:#1E1E1E;stroke-width:0.5;" rx="4" ry="4"/><text x="98.169" y="386.67" fill="#000" font-size="11" textLength="136.952" font-family="Helvetica">PostgreSQL, satu transaksi:</text><text x="98.169" y="397.67" fill="#000" font-size="11" textLength="265.885" font-family="Helvetica">INSERT log batch_id ... ON CONFLICT DO NOTHING</text><polygon points="15